[package]
name = "telegram-bot-api-rs"
version = "9.5.0"
edition = "2024"
authors = ["Sajjad Aghdam <34358062+sajadbaghalaghdam@users.noreply.github.com>"]
description = "High-performance, ultra-low memory Telegram Bot API Server written in 100% pure Rust. Drop-in replacement for tdlib/telegram-bot-api."
license = "BSL-1.0"
repository = "https://github.com/sajadbaghalaghdam/telegram-bot-api"
homepage = "https://sajadbaghalaghdam.github.io/telegram-bot-api/build.html"
keywords = ["telegram", "bot-api", "tdlib", "mtproto", "tokio"]
categories = ["network-programming", "web-programming::http-server", "command-line-utilities"]

[dependencies]
axum = { version = "0.8.9", features = ["tokio", "json", "multipart"] }
bytes = "1.10"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
thiserror = "2.0"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream", "socks"] }
mime_guess = "2.0"
sha1 = "0.10"
sha2 = "0.10"
aes = "0.8"
num-bigint = { version = "0.4", features = ["rand"] }
num-traits = "0.2"
rsa = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
dashmap = "6.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
